<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deploy Bomber</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/icon-512.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#060b1c" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0d0f17; overflow: hidden; }
      #game { width: 100vw; height: 100vh; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
      /* abertura enquanto o JS e as fontes carregam; o BootScene mostra a mesma logo e a remove */
      #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #060b1c; transition: opacity 0.3s; z-index: 1; }
      #splash img { height: 70vh; max-width: 90vw; object-fit: contain; }
    </style>
  </head>
  <body>
    <div id="splash"><img src="/brand/logo.png" alt="Deploy Bomber" /></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
