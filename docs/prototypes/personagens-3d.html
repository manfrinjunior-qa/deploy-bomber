<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deploy Bomber — Personagens em 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#12131A; --panel:#1C1E2A; --line:#2A2D3E; --txt:#F1F5F9; --muted:#A5ADC4; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:'Space Grotesk', system-ui, sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; }
  .top { position:fixed; top:0; left:0; right:0; padding:16px 20px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; pointer-events:none; flex-wrap:wrap; }
  .title { font-family:'Press Start 2P', monospace; font-size:16px; line-height:1.6; }
  .title small { display:block; font-family:'Space Grotesk', sans-serif; font-size:14px; color:var(--muted); margin-top:4px; }
  .toggles { display:flex; gap:8px; pointer-events:auto; flex-wrap:wrap; }
  button { font:inherit; cursor:pointer; }
  .tg { min-height:40px; padding:8px 14px; background:var(--panel); color:var(--txt); border:2px solid var(--line); font-family:'Press Start 2P', monospace; font-size:10px; }
  .tg[aria-pressed="true"] { border-color:#FDE047; color:#FDE047; }
  .dock { position:fixed; left:0; right:0; bottom:0; padding:12px 16px 16px; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; background:linear-gradient(transparent, rgba(18,19,26,.92) 30%); }
  .role { background:var(--panel); border-top:4px solid var(--c); padding:10px 12px; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .role h2 { margin:0; font-family:'Press Start 2P', monospace; font-size:10px; color:var(--c); display:flex; justify-content:space-between; gap:8px; }
  .role h2 span { font-family:'Space Grotesk', sans-serif; font-size:13px; color:var(--txt); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { min-height:32px; min-width:32px; padding:4px 8px; background:#262938; color:var(--muted); border:2px solid transparent; font-size:12px; }
  .chip[aria-pressed="true"] { border-color:var(--c); color:var(--txt); }
  .hint { position:fixed; right:20px; bottom:150px; font-size:12px; color:var(--muted); pointer-events:none; }
  .dock.boss .role { display:none; }
  .dock.boss .bossnote { display:block; }
  .bossnote { display:none; grid-column:1 / -1; background:var(--panel); border-top:4px solid #EF4444; padding:12px 14px; font-size:14px; }
  @media (max-width: 760px) {
    .dock { grid-template-columns:repeat(2, minmax(0,1fr)); }
    .hint { display:none; }
    .title { font-size:12px; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage" aria-label="Cena 3D com os personagens em voxel" role="img"></div>
<div class="top">
  <div class="title">DEPLOY BOMBER 3D<small>Os sprites viraram voxels: cada pixel é um cubo com profundidade</small></div>
  <div class="toggles">
    <button class="tg" id="tTeam" aria-pressed="true">TIME</button>
    <button class="tg" id="tBoss" aria-pressed="false">CHEFÕES</button>
    <button class="tg" id="tSpin" aria-pressed="true">GIRAR</button>
  </div>
</div>
<div class="hint">Arraste para girar · role para aproximar</div>
<div class="dock" id="dock">
  <div class="bossnote">Desafio do Cliente: as 4 versões do Cliente como chefões — Executivo, Startup, Investidora e Dono da empresa.</div>

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#12131A');
scene.fog = new THREE.Fog('#12131A', 140, 260);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 1000);
camera.position.set(30, 40, 92);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 11, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 40; controls.maxDistance = 200;

scene.add(new THREE.HemisphereLight('#dbe4ff', '#2a2233', 1.4));
const sun = new THREE.DirectionalLight('#fff4e0', 2.2);
sun.position.set(40, 80, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, near: 1, far: 250 });
scene.add(sun);
const rim = new THREE.DirectionalLight('#8b5cf6', 0.8); rim.position.set(-50, 30, -60); scene.add(rim);

const box = new THREE.BoxGeometry(1, 1, 1);
const mat = new THREE.MeshStandardMaterial({ roughness: 0.75, metalness: 0.05 });

function instanced(cubes) {
  const mesh = new THREE.InstancedMesh(box, mat, cubes.length);
  const m = new THREE.Matrix4(); const c = new THREE.Color();
  cubes.forEach((q, i) => {
    m.makeTranslation(q[0], q[1], q[2]);
    mesh.setMatrixAt(i, m);
    mesh.setColorAt(i, c.set(q[3]));
  });
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.instanceMatrix.needsUpdate = true;
  return mesh;
}

// ---------- voxel character
const HAIRKEYS = new Set(['H', 'h', 'O', 'o', 'Q', 'q', 'C', 'c', 'V', 'Z', 'N']);
const HELD = new Set(['Y', 'L', 'g', 'F', 'f', '$']);
function backColor(v) {
  const p = v.pal;
  if (v.hair === 'beard') return p.S;
  if (v.hair === 'astro') return p.W;
  if (v.hair === 'robot') return p.M;
  if (v.hair === 'ninja') return p.O;
  return p.H;
}
function mainBody(v) {
  const n = {};
  for (let r = 11; r <= 14; r++) for (const ch of v.rows[r]) if (ch !== '.' && ch !== 'S' && !HELD.has(ch)) n[ch] = (n[ch] || 0) + 1;
  return Object.entries(n).sort((a, b) => b[1] - a[1])[0][0];
}
function buildChar(v) {
  const cubes = []; const p = v.pal; const rows = v.rows; const Hh = rows.length;
  const back = backColor(v); const main = p[mainBody(v)];
  for (let r = 0; r < Hh; r++) {
    const isHead = r <= 10, isBody = r >= 11 && r <= 14;
    for (let c = 0; c < 16; c++) {
      const ch = rows[r][c]; if (ch === '.') continue;
      let depth = isHead ? 10 : isBody ? 6 : 5;
      let z0 = 0;
      if (isBody && HELD.has(ch)) { depth = 2; z0 = 2; }
      else if (isBody && ch === 'S') { depth = 3; z0 = 1.5; }
      for (let z = 0; z < depth; z++) {
        let col = p[ch];
        if (z > 0) {
          if (isHead) {
            if (v.hair === 'robot') col = HAIRKEYS.has(ch) || ch === 'M' || ch === 'm' ? p[ch] : p.M;
            else if (HAIRKEYS.has(ch) && !(v.hair === 'astro' && ch === 'Z')) col = p[ch];
            else if (v.hair === 'astro') col = (ch === 'W' || ch === 'w' || ch === 'G' || z >= 3) ? (ch === 'G' && z < 3 ? p.G : p.W) : p.S;
            else col = z >= depth * 0.45 ? back : p.S;
          } else if (isBody && !HELD.has(ch) && ch !== 'S') {
            col = z >= 1 ? main : p[ch];
          }
        }
        const zz = (isHead ? 5 : isBody ? 3 : 2.5) - z0 - z - 0.5;
        cubes.push([c - 7.5, Hh - r - 0.5, zz, col]);
      }
    }
  }
  const g = new THREE.Group(); g.add(instanced(cubes));
  return g;
}

// ---------- arena floor + props
const props = new THREE.Group(); scene.add(props);
(function buildArena() {
  const cubes = [];
  const N = 9;
  for (let i = -N; i <= N; i++) for (let j = -4; j <= 4; j++) {
    const col = (i + j) % 2 === 0 ? '#2A2D3E' : '#262938';
    for (let x = 0; x < 6; x++) for (let z = 0; z < 6; z++) cubes.push([i * 6 + x - 2.5, -0.5, j * 6 + z - 2.5, col]);
  }
  const rack = (cx, cz) => { for (let x = 0; x < 6; x++) for (let z = 0; z < 6; z++) for (let y = 0; y < 6; y++) {
      let col = '#4A5272'; if (y === 5) col = '#6A7398'; if ((y === 1 || y === 3) && z === 5 && x > 0 && x < 5) col = '#2B3044';
      if (z === 5 && ((y === 1 && x === 1) || (y === 3 && x === 2))) col = y === 1 ? '#4ADE80' : '#FBBF24';
      cubes.push([cx + x - 2.5, y + 0.5, cz + z - 2.5, col]); } };
  const crate = (cx, cz) => { for (let x = 0; x < 6; x++) for (let z = 0; z < 6; z++) for (let y = 0; y < 5; y++) {
      let col = '#B9824A'; if (y === 4) col = '#D9A066'; if (x === 2 || x === 3) col = '#EBCB95';
      if (z === 5 && y >= 1 && y <= 2 && x >= 1 && x <= 4 && !(x === 2 || x === 3)) col = '#F5F5F4';
      cubes.push([cx + x - 2.5, y + 0.5, cz + z - 2.5, col]); } };
  rack(-48, -18); rack(48, -18); rack(-48, 18); rack(48, 18); rack(0, -24);
  crate(-36, -24); crate(36, -24); crate(-54, 0); crate(54, 0); crate(24, 18);
  props.add(instanced(cubes));
  const bomb = new THREE.Mesh(new THREE.SphereGeometry(2.6, 12, 10), new THREE.MeshStandardMaterial({ color: '#1E1B2E', roughness: 0.4, flatShading: true }));
  bomb.position.set(-24, 2.6, 18); bomb.castShadow = true; props.add(bomb);
  const fuse = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.6, 0.6), new THREE.MeshStandardMaterial({ color: '#A16207' }));
  fuse.position.set(-24, 5.8, 18); props.add(fuse);
  const spark = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: '#FDE047' }));
  spark.position.set(-24, 7, 18); props.add(spark);
  props.userData.spark = spark;
})();

// ---------- lineup
const slots = [-30, -10, 10, 30];
const current = DATA.roles.map(() => 0);
let lineup = [];
let mode = 'team';
function clearLineup() { lineup.forEach(g => { scene.remove(g); g.traverse(o => { if (o.isInstancedMesh) o.dispose(); }); }); lineup = []; }
function place(list) {
  clearLineup();
  list.forEach((v, i) => { const g = buildChar(v); g.position.x = slots[i]; g.rotation.y = (i - 1.5) * -0.12; scene.add(g); lineup.push(g); });
}
function render() {
  if (mode === 'team') place(DATA.roles.map((r, i) => r.variants[current[i]]));
  else place(DATA.bosses);
}

// ---------- UI
const dock = document.getElementById('dock');
DATA.roles.forEach((r, ri) => {
  const el = document.createElement('section');
  el.className = 'role'; el.style.setProperty('--c', r.color);
  const h = document.createElement('h2'); h.textContent = r.label;
  const nm = document.createElement('span'); nm.textContent = r.variants[0].name; h.appendChild(nm);
  const chips = document.createElement('div'); chips.className = 'chips';
  r.variants.forEach((v, vi) => {
    const b = document.createElement('button'); b.className = 'chip'; b.type = 'button';
    b.textContent = String(vi + 1); b.title = v.name; b.setAttribute('aria-label', r.label + ': ' + v.name);
    b.setAttribute('aria-pressed', vi === 0 ? 'true' : 'false');
    b.addEventListener('click', () => {
      current[ri] = vi; nm.textContent = v.name;
      chips.querySelectorAll('.chip').forEach((x, xi) => x.setAttribute('aria-pressed', xi === vi ? 'true' : 'false'));
      render();
    });
    chips.appendChild(b);
  });
  el.append(h, chips); dock.appendChild(el);
});
const tTeam = document.getElementById('tTeam'), tBoss = document.getElementById('tBoss'), tSpin = document.getElementById('tSpin');
function setMode(m) { mode = m; tTeam.setAttribute('aria-pressed', m === 'team'); tBoss.setAttribute('aria-pressed', m === 'boss'); dock.classList.toggle('boss', m === 'boss'); render(); }
tTeam.addEventListener('click', () => setMode('team'));
tBoss.addEventListener('click', () => setMode('boss'));
tSpin.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; tSpin.setAttribute('aria-pressed', controls.autoRotate); });

function resize() { const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();
render();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  lineup.forEach((g, i) => { g.position.y = Math.max(0, Math.sin(t * 3 + i * 1.3)) * 0.8; });
  const s = props.userData.spark; s.scale.setScalar(0.8 + Math.abs(Math.sin(t * 8)) * 0.6);
  controls.update(); renderer.render(scene, camera);
});
window.__ready = true;
